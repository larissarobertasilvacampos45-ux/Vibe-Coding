<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha | Nexo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f7fc;color:#172133;font-family:system-ui,sans-serif}main{width:min(100%,440px);background:#fff;border:1px solid #dee5f0;border-radius:20px;padding:32px;box-shadow:0 18px 55px #16224212}.brand{font-size:30px;font-weight:800;color:#132541;margin-bottom:18px}p{color:#64748b;line-height:1.5;font-size:14px}label{display:grid;gap:7px;margin:16px 0;font-size:13px;font-weight:700}.field{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;width:100%}button,a{display:block;width:100%;padding:12px;border:0;border-radius:9px;background:#2563eb;color:white;text-align:center;text-decoration:none;font-weight:700;font:inherit;cursor:pointer;margin-top:16px}.notice{margin:15px 0;padding:12px;border-radius:9px;background:#e8f2ff;color:#1e3a5f;font-size:13px}.error{background:#fff0ef;color:#b42318}.success{background:#e3f8ed;color:#067647}[hidden]{display:none!important}
</style></head><body><main><div class="brand">◈ nexo</div><h1>Redefinir sua senha</h1><p>Cadastre uma nova senha para acessar o Nexo.</p><div id="status" class="notice">Validando o link de recuperação…</div><form id="form" hidden><label>Nova senha<input class="field" id="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirme a nova senha<input class="field" id="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button id="submit" type="submit">Salvar nova senha</button></form><a id="back" href="/" hidden>Voltar ao Nexo</a></main>
<script>
const statusEl=document.querySelector("#status"),form=document.querySelector("#form"),back=document.querySelector("#back"),hash=new URLSearchParams(location.hash.slice(1)),access_token=hash.get("access_token"),refresh_token=hash.get("refresh_token"),type=hash.get("type");
function message(text,kind="notice"){statusEl.textContent=text;statusEl.className=kind;}
if(hash.get("error_description"))message("O link não pôde ser validado. Solicite uma nova recuperação de senha.","error");
else if(type!=="recovery"||!access_token||!refresh_token)message("Link de recuperação inválido ou expirado. Volte ao Nexo e solicite um novo link.","error");
else{history.replaceState({},document.title,location.pathname+location.search);message("Link validado. Escolha uma senha com pelo menos 8 caracteres.");form.hidden=false;}
form.addEventListener("submit",async e=>{e.preventDefault();const password=document.querySelector("#password").value,confirmation=document.querySelector("#confirm").value;if(password.length<8){message("A senha precisa ter pelo menos 8 caracteres.","error");return;}if(password!==confirmation){message("As senhas não coincidem.","error");return;}const button=document.querySelector("#submit");button.disabled=true;button.textContent="Salvando…";try{const response=await fetch("/api/auth/update-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token,refresh_token,password})});const data=await response.json();if(!response.ok)throw Error(data.detail||"Falha ao alterar senha.");form.hidden=true;message("Senha alterada com sucesso! Você já pode entrar no Nexo.","success");back.hidden=false;}catch(err){message(err.message,"error");button.disabled=false;button.textContent="Salvar nova senha";}});
</script></body></html>
