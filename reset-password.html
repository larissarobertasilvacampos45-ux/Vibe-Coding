<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha | Nexo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fc; color: #172033; }
    main { box-sizing: border-box; width: min(92vw, 440px); padding: 32px; background: white; border: 1px solid #e7ebf4; border-radius: 20px; box-shadow: 0 18px 55px #16224214; }
    .brand { color: #6d42a1; font-size: 30px; font-weight: 800; margin-bottom: 6px; }
    p { color: #69758a; line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 18px 0 7px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #d8deea; border-radius: 9px; font: inherit; }
    button, .back { display: block; width: 100%; box-sizing: border-box; margin-top: 18px; padding: 12px; border: 0; border-radius: 9px; background: #4361ee; color: white; text-align: center; text-decoration: none; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .message { margin-top: 16px; font-size: 14px; overflow-wrap: anywhere; }
    .error { color: #b42318; }
    .success { color: #067647; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand">◈ nexo</div>
    <h1>Redefinir sua senha</h1>
    <p>Cadastre uma nova senha para acessar o Nexo.</p>
    <div id="status" class="message" role="status">Validando o link de recuperação…</div>
    <form id="reset-form" hidden>
      <label for="password">Nova senha</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm-password">Confirme a nova senha</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
      <button id="submit" type="submit">Salvar nova senha</button>
    </form>
    <a id="back" class="back" href="https://larissarobertasilvacampos45-ux-vibe-coding-app-zfk4fm.streamlit.app/" hidden>Voltar ao Nexo</a>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://detywcxtbokclyofzere.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4ZCLfjxmgnP3zlGNA5EgGw_lldVIGF4";
    const APP_URL = "https://larissarobertasilvacampos45-ux-vibe-coding-app-zfk4fm.streamlit.app/";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const status = document.querySelector("#status");
    const form = document.querySelector("#reset-form");
    const back = document.querySelector("#back");
    const submit = document.querySelector("#submit");

    function showError(message) {
      status.textContent = message;
      status.className = "message error";
      back.hidden = false;
    }

    async function initialize() {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const type = params.get("type");
      const urlError = params.get("error_description");

      if (urlError) {
        showError("O link não pôde ser validado. Solicite uma nova recuperação de senha.");
        return;
      }

      if (type !== "recovery" || !accessToken || !refreshToken) {
        showError("Link de recuperação inválido ou expirado. Volte ao Nexo e solicite um novo link.");
        return;
      }

      try {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (error) throw error;

        // Remove os tokens da barra de endereço após estabelecer a sessão.
        window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
        status.textContent = "Link validado. Escolha uma senha com pelo menos 8 caracteres.";
        status.className = "message";
        form.hidden = false;
      } catch (error) {
        showError("Não foi possível validar o link. Solicite uma nova recuperação de senha.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.querySelector("#password").value;
      const confirmation = document.querySelector("#confirm-password").value;

      if (password.length < 8) {
        showError("A senha precisa ter pelo menos 8 caracteres.");
        return;
      }
      if (password !== confirmation) {
        showError("As senhas não coincidem.");
        return;
      }

      submit.disabled = true;
      submit.textContent = "Salvando…";
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        form.hidden = true;
        status.textContent = "Senha alterada com sucesso! Você já pode entrar no Nexo com a nova senha.";
        status.className = "message success";
        back.hidden = false;
        window.setTimeout(() => { window.location.href = APP_URL; }, 3500);
      } catch (error) {
        showError("Não foi possível alterar a senha. Solicite um novo link e tente novamente.");
        submit.disabled = false;
        submit.textContent = "Salvar nova senha";
      }
    });

    initialize();
  </script>
</body>
</html>
